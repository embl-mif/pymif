[build-system]
requires = ["setuptools>=77", "setuptools-scm>=8", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zarrsmith"
dynamic = ["version"]
description = "Microscopy I/O, OME-Zarr forging and NGFF utilities: read vendor datasets, write multiscale OME-Zarr, fuse mosaics, from Python, the command line and napari."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Nicola Gritti", email = "nicola.gritti@embl.es" },
]
requires-python = ">=3.12"
keywords = ["microscopy", "zarr", "ome-zarr", "ngff", "napari"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: OS Independent",
]
dependencies = [
    "async-lru>=2.3.0",
    "bioio>=3.3.0",
    "bioio-czi>=2.6.0",
    "dask>=2026.3.0",
    "dask-image>=2025.11.0",
    "h5py>=3.16.0",
    "imagecodecs>=2026.10.10",
    "matplotlib>=3.10.8",
    "natsort",
    "numba>=0.64.0",
    "numcodecs>=0.16.5",
    "numpy>=2.4.3",
    "ome-zarr>=0.16.0",
    "pandas>=3.0.1",
    "readlif>=0.6.6",
    "scikit-image>=0.26.0",
    "scikit-learn>=1.8.0",
    "scipy>=1.17.1",
    "slideio>=2.10.0",
    "tifffile>=2026.3.3",
    "tqdm>=4.67.3",
    "typer>=0.24.1",
    "xlsxwriter>=3.2.9",
    "xyzservices>=2025.11.0",
    "zarr>=3.1.6",
    "zict>=3.0.0",
]

[project.urls]
Homepage = "https://github.com/embl-mif/zarrsmith"
Documentation = "https://embl-mif.github.io/zarrsmith/"
Issues = "https://github.com/embl-mif/zarrsmith/issues"
Changelog = "https://github.com/embl-mif/zarrsmith/releases"

[project.scripts]
zarrsmith = "zarrsmith.cli.zarrsmith:main"

[project.entry-points."napari.manifest"]
zarrsmith = "zarrsmith.napari:napari.yaml"

[project.optional-dependencies]
napari = [
    "magicgui>=0.10.1",
    "napari",
    "napari-animation",
    "napari-clusters-plotter>=0.11",
    "napari-metadata",
    "napari-ome-zarr>=0.8.2",
    "pyconify>=0.2.1",
    "PyQt6",
    "QtPy>=2.4.3",
]
notebooks = [
    "notebook>=7.5.5",
]
dev = [
    "pytest>=9.0.2",
    "build>=1.4.1",
    "wheel>=0.46.3",
]
docs = [
    "Sphinx>=9.1.0",
    "sphinx-autoapi>=3.8.0",
    "sphinx-autodoc-typehints>=3.9.11",
    "sphinx_rtd_theme>=3.1.0",
    "myst-parser>=5.0.0",
]
all = [
    "zarrsmith[napari,notebooks,dev,docs]",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["zarrsmith*"]

# The version is derived from git tags (vX.Y.Z), which are created automatically
# by .github/workflows/release.yml when a PR is merged into main.
[tool.setuptools_scm]
version_file = "zarrsmith/_version.py"
fallback_version = "0.0.0"

[tool.setuptools_scm.scm.git]
# Ignore the legacy calendar tags (v2026.x.y) so they never become the version base.
describe_command = "git describe --dirty --tags --long --abbrev=40 --match v*.*.* --exclude v20[0-9][0-9].*"
