name: Publish to PyPI

# Builds the tag v<version> and uploads it to PyPI with trusted publishing: PyPI accepts this
# workflow in the `pypi` environment, so no token is stored.
# Normal path: started by release.yml after a merged PR creates a new version tag (PyPI refuses
# trusted publishing from release.yml's own pull_request_target trigger).
# By hand: Actions > Publish to PyPI > Run workflow, with the version of an existing tag.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, without the leading v (e.g. 0.6.0); the tag v<version> must exist"
        required: true
        type: string

jobs:
  pypi:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/zarrsmith
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out release tag
        uses: actions/checkout@v5
        with:
          ref: v${{ inputs.version }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Build sdist and wheel
        env:
          SETUPTOOLS_SCM_PRETEND_VERSION: ${{ inputs.version }}
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
