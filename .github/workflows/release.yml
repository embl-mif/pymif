name: release

# Releases are opt-in: only a merged PR into main labelled release:major, release:minor or
# release:patch creates a vX.Y.Z tag, a GitHub Release, a PyPI release and a Docker image. All other merged
# PRs skip this workflow (the job-level `if` means no runner is started).
# The version is computed by .github/scripts/next_version.py.
# pull_request_target is used so merges of PRs from forks also get a write token; the
# job only checks out the merge commit, i.e. code that is already on main.
on:
  pull_request_target:
    types: [closed]
    branches: [main]

jobs:
  tag:
    if: >-
      github.event.pull_request.merged == true && (
      contains(github.event.pull_request.labels.*.name, 'release:major') ||
      contains(github.event.pull_request.labels.*.name, 'release:minor') ||
      contains(github.event.pull_request.labels.*.name, 'release:patch'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    # Serialize releases so two quick merges never compute the same version.
    concurrency:
      group: release
      cancel-in-progress: false
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Check out merge commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Compute next version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --json labels > "$RUNNER_TEMP/pr.json"
          version=$(python .github/scripts/next_version.py "$RUNNER_TEMP/pr.json")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ -z "$version" ]; then
            echo "No release for this PR."
          else
            echo "Next version: $version"
          fi

      - name: Create tag and GitHub Release
        if: steps.version.outputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "zarrsmith $VERSION" "$SHA"
          git push origin "v$VERSION"
          gh release create "v$VERSION" --repo "$GITHUB_REPOSITORY" \
            --title "v$VERSION" --generate-notes --verify-tag

  # PyPI refuses trusted publishing from pull_request_target (this workflow's trigger), so the
  # upload is its own workflow, started here: GITHUB_TOKEN may start workflow_dispatch runs.
  pypi:
    needs: tag
    if: needs.tag.outputs.version != ''
    runs-on: ubuntu-latest
    permissions:
      actions: write

    steps:
      - name: Start the PyPI publish workflow
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.tag.outputs.version }}
        run: |
          gh workflow run publish-pypi.yml --repo "$GITHUB_REPOSITORY" --ref main -f version="$VERSION"

  # Tags pushed with GITHUB_TOKEN do not trigger other workflows, so call the image build directly.
  docker:
    needs: tag
    if: needs.tag.outputs.version != ''
    uses: ./.github/workflows/docker-publish.yml
    with:
      version: ${{ needs.tag.outputs.version }}
    permissions:
      contents: read
      packages: write
