name: Build and Publish Docker Image

on:
  # Normal path: called by release.yml after a merged PR creates a new version tag.
  workflow_call:
    inputs:
      version:
        description: "Release version without the leading v (e.g. 0.10.1)"
        required: true
        type: string
  # Tags pushed by hand (not by release.yml's GITHUB_TOKEN) still build an image.
  push:
    tags:
      - 'v*'
  workflow_dispatch: # Allows manual triggering

env:
  REGISTRY: ghcr.io
  # Explicit, not github.repository: the images up to 0.5.5 stay at ghcr.io/embl-mif/pymif.
  IMAGE_NAME: ${{ github.repository_owner }}/zarrsmith

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest

    # Grants permissions to the GITHUB_TOKEN to upload packages to GHCR
    permissions:
      contents: read
      packages: write

    steps:
      - name: Resolve version
        id: ver
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          version="$INPUT_VERSION"
          if [ -z "$version" ] && [ "$GITHUB_REF_TYPE" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.ver.outputs.version && format('v{0}', steps.ver.outputs.version) || '' }}

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # Release version, e.g. 0.10.1, plus 'latest'
            type=raw,value=${{ steps.ver.outputs.version }},enable=${{ steps.ver.outputs.version != '' }}
            type=raw,value=latest,enable=${{ steps.ver.outputs.version != '' }}
            # Manual runs on a branch are tagged with the branch name
            type=ref,event=branch,enable=${{ steps.ver.outputs.version == '' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            ZARRSMITH_VERSION=${{ steps.ver.outputs.version }}
