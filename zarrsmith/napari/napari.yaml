name: zarrsmith
display_name: ZarrSmith
contributions:
  commands:
    - id: zarrsmith.convert
      python_name: zarrsmith.napari._convert_widget:convert_widget
      title: Converter Plugin
    - id: zarrsmith.export_widget
      python_name: zarrsmith.napari._export_widget:export_widget
      title: Export Widget
    - id: zarrsmith.mosaic
      python_name: zarrsmith.napari._mosaic_widget:mosaic_widget
      title: Mosaic Fusion
    - id: zarrsmith.explorer
      python_name: zarrsmith.napari._explorer_widget:explorer_widget
      title: Objects Explorer
  # napari lists the widgets in this order in Plugins > ZarrSmith
  widgets:
    - command: zarrsmith.convert
      display_name: Converter Plugin
    - command: zarrsmith.mosaic
      display_name: Mosaic Fusion
    - command: zarrsmith.explorer
      display_name: Objects Explorer
    - command: zarrsmith.export_widget
      display_name: Export Viewer
  menus:
    "napari/menu/plugins":
      - submenu: ZarrSmith
        items:
          - command: zarrsmith.convert
          - command: zarrsmith.mosaic
          - command: zarrsmith.explorer
          - command: zarrsmith.export_widget
